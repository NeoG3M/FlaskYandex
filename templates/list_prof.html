{%extends "base.html"%}

{% block content %}
<div class="container ml-3">
    <h3>Список профессий</h3>

    {% if list == "ol"%}
    <ol style="padding-left: 40px;">
        {% for item in profs %}
        <li style="font-syze: 29px;">{{item}}</li>
        {%endfor%}
    </ol>
    {% elif list == "ul"%}
    <ul style="padding-left: 40px;">
        {% for item in profs %}
        <li style="font-syze: 29px;">{{item}}</li>
        {%endfor%}
    </ul>

    {% else %}
    <p>Введён неверный параметр!</p>
    {% endif %}
</div>
{% endblock %}
